name: Release

# Publishes a stable release, either by pushing a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# or by running this workflow by hand (Actions -> Release -> Run workflow) and
# typing the tag; the tag is then created on the branch you run it from.
# Tags with a suffix (v1.2.0-rc1) become pre-releases and are skipped by the
# stable update channel. Releases are never deleted automatically.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.2.0 (add -rc1 etc. for a pre-release)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check the tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Tag must look like v1.2.3 or v1.2.3-rc1, got '$TAG'"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Stamp the version from the tag
        shell: bash
        run: |
          v="${TAG#v}"
          for f in crates/*/Cargo.toml; do
            sed -i.bak "1,/^version = /s/^version = .*/version = \"$v\"/" "$f"
            rm -f "$f.bak"
          done
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        run: python scripts/package_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${TAG#v}"
          short=$(git rev-parse --short=7 HEAD)
          day=$(date -u +%Y-%m-%d)
          if [[ "$v" == *-* ]]; then kind="--prerelease"; else kind="--latest"; fi
          notes=(--generate-notes)
          if [[ -f RELEASE_NOTES.md ]]; then notes=(--notes-file RELEASE_NOTES.md); fi
          if [[ "${{ github.event_name }}" == "push" ]]; then where="--verify-tag"; else where="--target $GITHUB_SHA"; fi
          ls -l dist
          # The in-app updater compares the LAST token of the title with its own commit.
          gh release create "$TAG" dist/* \
            --title "MINT - $v - $day - $short" \
            $where $kind "${notes[@]}"

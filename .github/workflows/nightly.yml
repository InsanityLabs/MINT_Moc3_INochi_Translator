name: Nightly

# One pre-release per build, tagged nightly-<date>-<time>-<commit>, with a zip
# for every platform. The newest 10 are kept and older nightlies are deleted.
# Stable releases (v* tags) are never touched. Pre-releases are skipped by
# GitHub's "latest release", so stable users of the in-app updater never see them.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main has not changed since the last nightly"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  KEEP: 10

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      short: ${{ steps.gate.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Anything new since the last nightly?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          if gh release list --limit 100 --json tagName -q '.[].tagName' | grep -q -- "^nightly-.*-$short$" \
             && [[ "${{ inputs.force }}" != "true" ]]; then
            echo "A nightly for $short already exists, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        run: python scripts/package_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.gate.outputs.short }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          stamp=$(date -u +%Y%m%d-%H%M)
          day=$(date -u +%Y-%m-%d)
          gh release create "nightly-$stamp-$SHORT" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "MINT Nightly - $day - $SHORT" \
            --notes "Automatic build of commit $SHORT for Windows, Linux and macOS. May be unstable; use the Stable channel for tested releases."
      - name: Keep only the newest nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Only pre-releases whose tag starts with "nightly-" are ever pruned.
          old=$(gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            -q "[.[] | select(.isPrerelease and (.tagName | startswith(\"nightly-\")))] | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName")
          for tag in $old; do
            echo "Removing old nightly $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
          # The single rolling "nightly" release from the first version of this workflow.
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
